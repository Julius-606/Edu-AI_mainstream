<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4">
    <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold">T</div>
            <div>
                <h1 class="text-xl font-bold">Trace Backend Admin</h1>
                <p class="text-xs text-slate-500">Backend v{{ version }}</p>
            </div>
        </div>
        {% if error %}
        <div class="mb-5 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">{{ error }}</div>
        {% endif %}
        <form method="post" action="/admin/login" class="space-y-4">
            <input type="email" name="email" required placeholder="Admin email"
                class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">
            <input type="password" name="password" required placeholder="Password"
                class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">
            <button class="w-full rounded-xl bg-indigo-600 py-3 font-bold hover:bg-indigo-500">Sign in</button>
        </form>
        <p class="mt-6 text-xs text-slate-500">Configure ADMIN_EMAIL and ADMIN_PASSWORD in the backend environment before signing in.</p>
    </main>
</body>
</html>
