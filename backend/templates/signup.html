<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu-AI | Join the Trace Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">Edu-AI</h1>
            <p class="text-gray-500 mt-2">Create your Trace Learning account</p>
        </div>

        <form action="/signup" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700">Full Name / Username</label>
                <input type="text" name="username" required
                    class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Email Address</label>
                <input type="email" name="email" required
                    class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Password</label>
                <input type="password" name="password" required
                    class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700">Account Type</label>
                <select name="role" class="mt-1 block w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
                    <option value="Student">👩‍🎓 Student Portal</option>
                    <option value="Teacher">👨‍🏫 Teacher Portal</option>
                </select>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 active:transform active:scale-95 transition duration-200 shadow-lg shadow-indigo-200">
                CREATE ACCOUNT
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Already have an account?
            <a href="#" class="text-indigo-600 font-semibold hover:underline" onclick="window.close()">Back to App</a>
        </p>
    </div>
</body>
</html>
