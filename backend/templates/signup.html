<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trace Learning System - Account Registration</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            margin-top: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            margin-top: 24px;
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        .footer-note {
            margin-top: 16px;
            font-size: 12px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Trace Registration</h2>
        <p style="color: #94a3b8; font-size: 14px;">Register a new student, teacher, or parent account on the Trace Learning System.</p>
        <form action="/signup" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">

            <label for="role">Role</label>
            <select id="role" name="role">
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
                <option value="Parent">Parent</option>
            </select>

            <button type="submit">Complete Sign Up</button>
        </form>
        <div class="footer-note">Trace Modular Backend • Hugging Face Space & Neon PostgreSQL</div>
    </div>
</body>
</html>
